<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Yaro Jump</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Перехватываем создание AudioContext, который Unity создаёт для звука.
      // Это нужно, чтобы уметь глушить/возобновлять звук игры снаружи —
      // доступа к исходникам C# (AudioListener и т.п.) у нас нет, а сборка
      // всегда использует именно Web Audio API для всех звуков/музыки.
      // Должно выполниться ДО загрузки Build/*.framework.js.
      (function () {
        var Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        function PatchedAudioContext(options) {
          var ctx = new Native(options);
          window.__unityAudioContext = ctx;
          return ctx;
        }
        PatchedAudioContext.prototype = Native.prototype;
        window.AudioContext = PatchedAudioContext;
        window.webkitAudioContext = PatchedAudioContext;
      })();
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=400 height=1000></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Yaro Jump</div>
      </div>

      <!-- п.2 требований модерации VK: возможность выключить/отрегулировать звук -->
      <button id="sound-toggle-button" type="button" title="Вкл/выкл звук">🔊</button>
    </div>

    <!-- п.5 требований модерации VK: онбординг с объяснением механик -->
    <div id="onboarding-overlay">
      <div id="onboarding-card">
        <h2>Как играть</h2>
        <ol>
          <li>Управляйте персонажем и прыгайте по платформам как можно выше.</li>
          <li>Собирайте бонусы на пути — они дают дополнительные очки.</li>
          <li>Не упадите вниз — при падении игра заканчивается.</li>
        </ol>
        <p style="font-size:13px;color:#666;margin-top:-8px;">
          (Замените текст выше на реальное описание механик вашей игры.)
        </p>
        <button id="onboarding-close-button" type="button">Понятно, играть!</button>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/RUSversion.loader.js";
      var config = {
        dataUrl: buildUrl + "/RUSversion.data",
        frameworkUrl: buildUrl + "/RUSversion.framework.js",
        codeUrl: buildUrl + "/RUSversion.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NoobDev",
        productName: "Yaro Jump",
        productVersion: "2",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        canvas.style.width = "400px";
        canvas.style.height = "1000px";
      }

      loadingBar.style.display = "block";

      // ВАЖНО: раньше здесь была ошибка — переменная unityI, в которую
      // ниже (в vkBridge-коде) пишут SendMessage(), нигде не объявлялась
      // и не присваивалась. Из-за этого auth()/getUserData()/showRewardedAd()
      // падали с ReferenceError, и, в частности, загруженный из VK Storage
      // прогресс никогда не долетал обратно в игру (п.4 замечаний).
      var unityI = null;

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          unityI = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <script type="text/javascript">

      vkBridge.send('VKWebAppInit');

      function auth(){
        vkBridge.send('VKWebAppGetUserInfo').then(_info => {
          console.log(_info);
          if (unityI) unityI.SendMessage('VKSDK', 'AuthenticateSuccess', JSON.stringify(_info));
        });
      }

      function getUserData(){
        vkBridge.send("VKWebAppStorageGet", {"keys": ["_save"]}).then(data => {
          console.log(data);
          if (unityI) unityI.SendMessage('VKSDK', 'DataGetting', JSON.stringify(data));
        });
      }

      function setUserData(data){
        console.log(data);
        vkBridge.send('VKWebAppStorageSet', {"key": "_save", "value": data}).then(_info => {
          console.log("Saved!");
        });
      }

      function showFullscrenAd(){
        vkBridge.send('VKWebAppShowNativeAds', {ad_format: "interstitial"}).then(data => {
          console.log(data);
        });
      }

      function showRewardedAd(){
        vkBridge.send('VKWebAppShowNativeAds', {ad_format: "reward"}).then(data => {
          console.log(data);
          if (unityI) unityI.SendMessage('VKSDK', 'RewardGetting', JSON.stringify(data.result));
        });
      }

      // ===================================================================
      // п.2: регулировка/выключение звука + п.3: не играть музыку в фоне
      // ===================================================================
      var soundToggleButton = document.getElementById('sound-toggle-button');
      var SOUND_PREF_KEY = 'yarojump_sound_muted';
      var userMuted = localStorage.getItem(SOUND_PREF_KEY) === '1';
      var appBackgrounded = false;

      function updateSoundButtonIcon() {
        soundToggleButton.textContent = userMuted ? '🔇' : '🔊';
        soundToggleButton.setAttribute('aria-pressed', userMuted ? 'true' : 'false');
      }

      function applyAudioState() {
        var ctx = window.__unityAudioContext;
        if (!ctx) return; // AudioContext ещё не создан движком — попробуем позже
        try {
          if (userMuted || appBackgrounded) {
            if (ctx.state === 'running') ctx.suspend();
          } else {
            if (ctx.state === 'suspended') ctx.resume();
          }
        } catch (e) {
          console.warn('Audio state toggle failed:', e);
        }
      }

      soundToggleButton.addEventListener('click', function () {
        userMuted = !userMuted;
        localStorage.setItem(SOUND_PREF_KEY, userMuted ? '1' : '0');
        updateSoundButtonIcon();
        applyAudioState();
      });
      updateSoundButtonIcon();

      // AudioContext в Unity WebGL создаётся не мгновенно при старте, а при
      // первом обращении к звуку — поэтому опрашиваем, пока он не появится,
      // и сразу применяем текущее состояние (например, если звук был
      // выключен пользователем в прошлый раз).
      var audioWatcher = setInterval(function () {
        if (window.__unityAudioContext) {
          applyAudioState();
          clearInterval(audioWatcher);
        }
      }, 300);

      function setBackgrounded(isBackgrounded) {
        appBackgrounded = isBackgrounded;
        applyAudioState();
      }

      // Основной сценарий внутри приложения VK — сообщения от самого VK
      // о сворачивании/разворачивании мини-приложения.
      // См. https://dev.vk.com/ru/games/how-to/handle-minimize-and-restore-events
      vkBridge.subscribe(function (e) {
        if (!e || !e.detail) return;
        switch (e.detail.type) {
          case 'VKWebAppViewHide':
            setBackgrounded(true);
            break;
          case 'VKWebAppViewRestore':
            setBackgrounded(false);
            break;
        }
      });

      // Доп. подстраховка на случай обычного сворачивания вкладки/браузера.
      document.addEventListener('visibilitychange', function () {
        setBackgrounded(document.hidden);
      });

      // ===================================================================
      // п.5: онбординг при первом запуске
      // ===================================================================
      var ONBOARDING_KEY = 'yarojump_onboarding_seen';
      var onboardingOverlay = document.getElementById('onboarding-overlay');
      var onboardingCloseButton = document.getElementById('onboarding-close-button');

      if (localStorage.getItem(ONBOARDING_KEY) === '1') {
        onboardingOverlay.style.display = 'none';
      }

      onboardingCloseButton.addEventListener('click', function () {
        onboardingOverlay.style.display = 'none';
        localStorage.setItem(ONBOARDING_KEY, '1');
      });

    </script>

  </body>
</html>
